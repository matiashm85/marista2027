<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiesta Maristas 2027 · Estado financiero</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #f9f9f7;
    --surface:  #ffffff;
    --border:   #e5e4df;
    --text:     #1a1a18;
    --muted:    #6b6b66;
    --hint:     #9e9e99;
    --green:    #0f6e56;
    --green-bg: #e1f5ee;
    --red:      #993c1d;
    --red-bg:   #faece7;
    --blue:     #185fa5;
    --blue-bg:  #e6f1fb;
    --amber:    #854f0b;
    --amber-bg: #faeeda;
    --radius:   10px;
    --shadow:   0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Header ─────────────────────────────────── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-icon {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--green-bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .header-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .header-sub   { font-size: 12px; color: var(--muted); }
  .btn-refresh {
    font-size: 12px; padding: 6px 14px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: background .15s;
  }
  .btn-refresh:hover { background: var(--bg); }

  /* ── Main layout ─────────────────────────────── */
  main { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }

  /* ── KPI cards ───────────────────────────────── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .kpi-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .kpi-icon { font-size: 14px; }
  .kpi-value { font-size: 24px; font-weight: 600; }
  .kpi-value.ing  { color: var(--green); }
  .kpi-value.gas  { color: var(--red); }
  .kpi-value.pos  { color: var(--blue); }
  .kpi-value.neg  { color: var(--red); }
  .kpi-sub { font-size: 11px; color: var(--hint); margin-top: 4px; }

  /* ── Progress ────────────────────────────────── */
  .progress-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 28px;
    box-shadow: var(--shadow);
  }
  .progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .progress-track { height: 6px; background: var(--bg); border-radius: 99px; overflow: hidden; }
  .progress-fill  { height: 100%; background: var(--green); border-radius: 99px; transition: width .6s ease; }
  .progress-foot  { display: flex; justify-content: space-between; font-size: 11px; color: var(--hint); margin-top: 6px; }

  /* ── Sections ────────────────────────────────── */
  .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin-bottom: 10px; font-weight: 500;
  }
  .section { margin-bottom: 32px; }

  /* ── Table ───────────────────────────────────── */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); font-weight: 500;
    padding: 10px 14px; background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  thead th.right { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafaf8; }
  td { padding: 10px 14px; vertical-align: middle; }
  td.right { text-align: right; }

  .partner { font-weight: 500; color: var(--text); }
  .fecha   { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .monto-ing { font-weight: 600; color: var(--green); white-space: nowrap; }
  .monto-gas { font-weight: 600; color: var(--red);   white-space: nowrap; }

  .badge {
    font-size: 10px; padding: 2px 7px; border-radius: 99px;
    font-weight: 500; white-space: nowrap;
  }
  .badge-paid    { background: var(--green-bg); color: var(--green); }
  .badge-pending { background: var(--amber-bg); color: var(--amber); }

  .link-comp {
    font-size: 11px; color: var(--blue);
    text-decoration: none; display: inline-flex; align-items: center; gap: 3px;
  }
  .link-comp:hover { text-decoration: underline; }
  .link-comp svg { width: 10px; height: 10px; flex-shrink: 0; }

  /* ── Status / error ──────────────────────────── */
  .status-msg {
    text-align: center; padding: 32px; color: var(--muted); font-size: 13px;
  }
  .error-msg {
    background: var(--red-bg); color: var(--red);
    border-radius: var(--radius); padding: 14px 18px;
    font-size: 13px; margin-bottom: 20px;
  }

  /* ── Timestamp ───────────────────────────────── */
  .timestamp { font-size: 11px; color: var(--hint); text-align: right; margin-bottom: 18px; }

  /* ── Spinner ─────────────────────────────────── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 18px; height: 18px; border: 2px solid var(--border);
    border-top-color: var(--green); border-radius: 50%;
    animation: spin .7s linear infinite; display: inline-block;
  }

  /* ── Responsive ──────────────────────────────── */
  @media (max-width: 600px) {
    .kpi-grid { grid-template-columns: 1fr 1fr; }
    .kpi-value { font-size: 20px; }
    thead th.hide-mobile, td.hide-mobile { display: none; }
    main { padding: 18px 14px 40px; }
  }
</style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="header-left">
    <div class="header-icon">🎓</div>
    <div>
      <div class="header-title">Fiesta Maristas 2027</div>
      <div class="header-sub">Promoción 2002 · Estado financiero</div>
    </div>
  </div>
  <button class="btn-refresh" onclick="cargar()" id="btn-refresh">
    <span id="refresh-icon">↻</span> Actualizar
  </button>
</header>

<!-- ── Main ── -->
<main>
  <div id="error-box" style="display:none" class="error-msg"></div>

  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-label"><span class="kpi-icon">↑</span> Ingresos</div>
      <div class="kpi-value ing" id="kpi-ing">—</div>
      <div class="kpi-sub" id="kpi-ing-sub"></div>
    </div>
    <div class="kpi">
      <div class="kpi-label"><span class="kpi-icon">↓</span> Gastos</div>
      <div class="kpi-value gas" id="kpi-gas">—</div>
      <div class="kpi-sub" id="kpi-gas-sub"></div>
    </div>
    <div class="kpi">
      <div class="kpi-label"><span class="kpi-icon">◎</span> Saldo</div>
      <div class="kpi-value" id="kpi-sal">—</div>
      <div class="kpi-sub">ingresos − gastos</div>
    </div>
  </div>

  <!-- Barra de progreso -->
  <div class="progress-card">
    <div class="progress-meta">
      <span>Avance hacia la meta</span>
      <span id="pct-label">—</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="progress-foot">
      <span id="meta-label">Meta: Bs. —</span>
      <span id="falta-label"></span>
    </div>
  </div>

  <!-- Timestamp -->
  <div class="timestamp" id="timestamp"></div>

  <!-- Ingresos -->
  <div class="section">
    <div class="section-label">Ingresos</div>
    <div class="table-wrap">
      <div id="tabla-ingresos"><div class="status-msg"><span class="spinner"></span></div></div>
    </div>
  </div>

  <!-- Gastos -->
  <div class="section">
    <div class="section-label">Gastos</div>
    <div class="table-wrap">
      <div id="tabla-gastos"><div class="status-msg"><span class="spinner"></span></div></div>
    </div>
  </div>
</main>

<script>
// ── Configuración ─────────────────────────────────────────────
// Reemplazá esta URL con la de tu Web App de Apps Script
// después de publicarla (Implementar → Nueva implementación → Web App)
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1yhnr6kBpO7G9ld0zKV7BPmWtWbrmxHC4aahnFDKSb8rZ8FAqyoltVInpyCncyVOpeQ/exec";

const META = 50000; // Meta en Bs. — ajustá según el presupuesto real

// ── Formato ───────────────────────────────────────────────────
function fmt(n) {
  return "Bs. " + Math.round(n).toLocaleString("es-BO");
}
function fmtFecha(str) {
  if (!str) return "—";
  const [y, m, d] = str.split("-");
  const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return d + " " + meses[parseInt(m) - 1] + " " + y.slice(2);
}
function iconoExterno() {
  return `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2H2v8h8V7M7 2h3v3M10 2L5.5 6.5"/></svg>`;
}

// ── Render tabla ──────────────────────────────────────────────
function renderTabla(filas, tipo) {
  if (!filas.length) {
    return `<div class="status-msg">Sin registros aún</div>`;
  }
  const clsMonto = tipo === "ing" ? "monto-ing" : "monto-gas";
  let html = `<table>
    <thead>
      <tr>
        <th>Descripción</th>
        <th class="hide-mobile">Fecha</th>
        <th class="right">Monto</th>
        <th class="hide-mobile">Estado</th>
        <th class="hide-mobile right">Comprobante</th>
      </tr>
    </thead>
    <tbody>`;

  filas.forEach(f => {
    const badge = f.pagado
      ? `<span class="badge badge-paid">Pagado</span>`
      : `<span class="badge badge-pending">Pendiente</span>`;
    const link = `<a href="${f.url}" target="_blank" class="link-comp">${f.comprobante} ${iconoExterno()}</a>`;
    html += `<tr>
      <td><span class="partner">${escHtml(f.nombre)}</span></td>
      <td class="fecha hide-mobile">${fmtFecha(f.fecha)}</td>
      <td class="right ${clsMonto}">${fmt(f.monto)}</td>
      <td class="hide-mobile">${badge}</td>
      <td class="right hide-mobile">${link}</td>
    </tr>`;
  });

  html += `</tbody></table>`;
  return html;
}

function escHtml(str) {
  return (str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── Actualizar UI ─────────────────────────────────────────────
function actualizarUI(data) {
  const { resumen, ingresos, gastos, actualizado } = data;

  // KPIs
  document.getElementById("kpi-ing").textContent = fmt(resumen.total_ingresos);
  document.getElementById("kpi-ing-sub").textContent = resumen.cant_ingresos + " registro" + (resumen.cant_ingresos !== 1 ? "s" : "");
  document.getElementById("kpi-gas").textContent = fmt(resumen.total_gastos);
  document.getElementById("kpi-gas-sub").textContent = resumen.cant_gastos + " registro" + (resumen.cant_gastos !== 1 ? "s" : "");

  const salEl = document.getElementById("kpi-sal");
  salEl.textContent = fmt(resumen.saldo);
  salEl.className = "kpi-value " + (resumen.saldo >= 0 ? "pos" : "neg");

  // Progreso
  const pct = Math.min(100, Math.round((resumen.total_ingresos / META) * 100));
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("pct-label").textContent = pct + "%";
  document.getElementById("meta-label").textContent = "Meta: " + fmt(META);
  const falta = META - resumen.total_ingresos;
  document.getElementById("falta-label").textContent =
    falta > 0 ? "Faltan " + fmt(falta) : "¡Meta superada!";

  // Tablas
  document.getElementById("tabla-ingresos").innerHTML = renderTabla(ingresos, "ing");
  document.getElementById("tabla-gastos").innerHTML   = renderTabla(gastos, "gas");

  // Timestamp
  const d = new Date(actualizado);
  document.getElementById("timestamp").textContent =
    "Actualizado: " + d.toLocaleDateString("es-BO") + " " + d.toLocaleTimeString("es-BO");
}

// ── Fetch principal ───────────────────────────────────────────
async function cargar() {
  const btn = document.getElementById("btn-refresh");
  const icon = document.getElementById("refresh-icon");
  btn.disabled = true;
  icon.innerHTML = `<span class="spinner" style="width:12px;height:12px;border-width:1.5px;"></span>`;
  document.getElementById("error-box").style.display = "none";

  try {
    const resp = await fetch(APPS_SCRIPT_URL + "?t=" + Date.now());
    const json = await resp.json();
    if (!json.ok) throw new Error(json.error || "Error desconocido");
    actualizarUI(json.data);
  } catch (e) {
    document.getElementById("error-box").textContent = "Error al cargar datos: " + e.message;
    document.getElementById("error-box").style.display = "block";
  } finally {
    btn.disabled = false;
    icon.textContent = "↻";
  }
}

// ── Auto-refresh cada 5 minutos ───────────────────────────────
cargar();
setInterval(cargar, 5 * 60 * 1000);
</script>
</body>
</html>
