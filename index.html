<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiesta Maristas 2027 · Estado financiero</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #f9f9f7;
    --surface:  #ffffff;
    --border:   #e5e4df;
    --text:     #1a1a18;
    --muted:    #6b6b66;
    --hint:     #9e9e99;
    --green:    #0f6e56;
    --green-bg: #e1f5ee;
    --red:      #993c1d;
    --red-bg:   #faece7;
    --blue:     #185fa5;
    --blue-bg:  #e6f1fb;
    --amber:    #854f0b;
    --amber-bg: #faeeda;
    --purple:   #534ab7;
    --purple-bg:#eeedfe;
    --radius:   10px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.5; min-height: 100vh;
  }

  /* Header */
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 10;
  }
  .header-left  { display: flex; align-items: center; gap: 12px; }
  .header-icon  {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--green-bg); display: flex; align-items: center;
    justify-content: center; font-size: 17px;
  }
  .header-title { font-size: 15px; font-weight: 600; }
  .header-sub   { font-size: 12px; color: var(--muted); }
  .btn-refresh  {
    font-size: 12px; padding: 6px 14px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .btn-refresh:hover { background: var(--bg); }

  /* Layout */
  main { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }

  /* KPI grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .kpi {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
  }
  .kpi-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 5px;
  }
  .kpi-value { font-size: 22px; font-weight: 600; }
  .kpi-value.ing    { color: var(--green); }
  .kpi-value.gas    { color: var(--red); }
  .kpi-value.pagado { color: var(--amber); }
  .kpi-value.pos    { color: var(--blue); }
  .kpi-value.neg    { color: var(--red); }
  .kpi-sub { font-size: 11px; color: var(--hint); margin-top: 3px; }

  /* Progress */
  .progress-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 28px;
  }
  .progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 7px; }
  .progress-track { height: 6px; background: var(--bg); border-radius: 99px; overflow: hidden; }
  .progress-fill  { height: 100%; background: var(--green); border-radius: 99px; transition: width .6s; }
  .progress-foot  { display: flex; justify-content: space-between; font-size: 11px; color: var(--hint); margin-top: 5px; }

  /* Section */
  .section        { margin-bottom: 32px; }
  .section-label  {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin-bottom: 10px; font-weight: 500;
  }

  /* Grupo de ingresos */
  .grupo {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; margin-bottom: 12px;
  }
  .grupo-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 16px; background: var(--bg);
    border-bottom: 1px solid var(--border); cursor: pointer;
    user-select: none;
  }
  .grupo-header:hover { background: #f3f2ef; }
  .grupo-titulo { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .grupo-badge  {
    font-size: 10px; padding: 2px 8px; border-radius: 99px;
    background: var(--green-bg); color: var(--green); font-weight: 500;
  }
  .grupo-total  { font-size: 14px; font-weight: 600; color: var(--green); }
  .grupo-arrow  { font-size: 11px; color: var(--muted); margin-left: 12px; transition: transform .2s; }
  .grupo-arrow.open { transform: rotate(180deg); }
  .grupo-body   { display: none; }
  .grupo-body.open { display: block; }

  /* Tabla ingresos (sin links) */
  .ing-table { width: 100%; border-collapse: collapse; }
  .ing-table th {
    text-align: left; font-size: 11px; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); font-weight: 500;
    padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .ing-table th.right { text-align: right; }
  .ing-table td { padding: 9px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .ing-table td.right { text-align: right; }
  .ing-table tr:last-child td { border-bottom: none; }
  .ing-table tr:hover td { background: #fafaf8; }
  .ing-monto { font-weight: 600; color: var(--green); white-space: nowrap; }

  /* Tabla gastos */
  .gas-table-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .gas-item { border-bottom: 1px solid var(--border); }
  .gas-item:last-child { border-bottom: none; }
  .gas-item-header {
    display: grid; grid-template-columns: 1fr auto;
    padding: 12px 16px 6px; gap: 8px;
  }
  .gas-nombre { font-weight: 500; font-size: 14px; }
  .gas-comprobante { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .gas-montos {
    display: grid; grid-template-columns: repeat(3, 1fr);
    padding: 6px 16px 12px; gap: 8px; border-top: 1px solid var(--border);
    background: var(--bg); margin-top: 8px;
  }
  .gas-monto-item { text-align: center; }
  .gas-monto-label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 3px; }
  .gas-monto-value { font-size: 14px; font-weight: 600; }
  .gas-monto-value.total  { color: var(--red); }
  .gas-monto-value.pagado { color: var(--amber); }
  .gas-monto-value.saldo  { color: var(--blue); }
  .gas-monto-value.saldo-cero { color: var(--green); }

  /* Pagos de proveedor */
  .pagos-titulo {
    font-size: 11px; color: var(--muted); padding: 6px 16px 4px;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .pago-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 16px; font-size: 12px; border-top: 1px solid var(--border);
  }
  .pago-row:hover { background: #fafaf8; }
  .pago-ref  { color: var(--muted); }
  .pago-fecha { color: var(--hint); font-size: 11px; margin-left: 8px; }
  .pago-monto { font-weight: 500; color: var(--amber); white-space: nowrap; }
  .pago-link  {
    font-size: 11px; color: var(--blue); text-decoration: none;
    display: inline-flex; align-items: center; gap: 3px; margin-left: 10px;
  }
  .pago-link:hover { text-decoration: underline; }

  /* Badge estado */
  .badge {
    font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 500;
  }
  .badge-paid    { background: var(--green-bg); color: var(--green); }
  .badge-partial { background: var(--amber-bg); color: var(--amber); }
  .badge-pending { background: var(--red-bg);   color: var(--red); }

  /* Link externo */
  .ext-link {
    font-size: 11px; color: var(--blue); text-decoration: none;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .ext-link:hover { text-decoration: underline; }

  /* Misc */
  .status-msg { text-align: center; padding: 28px; color: var(--muted); font-size: 13px; }
  .error-msg  {
    background: var(--red-bg); color: var(--red);
    border-radius: var(--radius); padding: 12px 16px;
    font-size: 13px; margin-bottom: 20px;
  }
  .timestamp  { font-size: 11px; color: var(--hint); text-align: right; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--green); border-radius: 50%;
    animation: spin .7s linear infinite; display: inline-block;
  }

  @media (max-width: 600px) {
    .kpi-grid { grid-template-columns: 1fr 1fr; }
    .gas-montos { grid-template-columns: 1fr 1fr 1fr; }
    main { padding: 16px 12px 40px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-icon">🎓</div>
    <div>
      <div class="header-title">Fiesta Maristas 2027</div>
      <div class="header-sub">Promoción 2002 · Estado financiero</div>
    </div>
  </div>
  <button class="btn-refresh" onclick="cargar()" id="btn-refresh">
    <span id="refresh-icon">↻</span> Actualizar
  </button>
</header>

<main>
  <div id="error-box" style="display:none" class="error-msg"></div>

  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-label">↑ Ingresos</div>
      <div class="kpi-value ing" id="kpi-ing">—</div>
      <div class="kpi-sub" id="kpi-ing-sub"></div>
    </div>
    <div class="kpi">
      <div class="kpi-label">↓ Deuda total</div>
      <div class="kpi-value gas" id="kpi-gas">—</div>
      <div class="kpi-sub" id="kpi-gas-sub"></div>
    </div>
    <div class="kpi">
      <div class="kpi-label">✓ Pagado a proveed.</div>
      <div class="kpi-value pagado" id="kpi-pagado">—</div>
      <div class="kpi-sub">pagos realizados</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">◎ Saldo en caja</div>
      <div class="kpi-value" id="kpi-sal">—</div>
      <div class="kpi-sub">ingresos − pagos</div>
    </div>
  </div>

  <!-- Progreso -->
  <div class="progress-card">
    <div class="progress-meta">
      <span>Avance hacia la meta</span>
      <span id="pct-label">—</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="progress-foot">
      <span id="meta-label">Meta: Bs. —</span>
      <span id="falta-label"></span>
    </div>
  </div>

  <div class="timestamp" id="timestamp"></div>

  <!-- Ingresos -->
  <div class="section">
    <div class="section-label">Ingresos</div>
    <div id="grupos-ingresos"><div class="status-msg"><span class="spinner"></span></div></div>
  </div>

  <!-- Gastos -->
  <div class="section">
    <div class="section-label">Gastos</div>
    <div id="lista-gastos"><div class="status-msg"><span class="spinner"></span></div></div>
  </div>
</main>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHnxoBNfNQf40Hf6QSZIkWyWQ6q-7SLU6LdO6rbzrtJiUT5rsy1ELjFs14_sc9wnCmHg/exec";
const META = 50000;

function fmt(n) {
  return "Bs. " + Math.round(n).toLocaleString("es-BO");
}
function fmtFecha(str) {
  if (!str) return "—";
  const [y, m, d] = str.split("-");
  const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return d + " " + meses[parseInt(m)-1] + " " + y.slice(2);
}
function escHtml(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function iconoExt() {
  return `<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2H2v8h8V7M7 2h3v3M10 2L5.5 6.5"/></svg>`;
}

// ── Render ingresos agrupados ─────────────────────────────────
function renderGruposIngresos(grupos) {
  if (!grupos || !grupos.length) return '<div class="status-msg">Sin ingresos</div>';

  return grupos.map((grupo, gi) => {
    const items = grupo.items || [];
    const filas = items.map(p => `
      <tr>
        <td>${escHtml(p.nombre)}</td>
        <td class="right ing-monto">${fmt(p.total)}</td>
      </tr>`).join("");

    const total = items.reduce((s,p) => s + p.total, 0);

    return `
    <div class="grupo">
      <div class="grupo-header" onclick="toggleGrupo(${gi})">
        <span class="grupo-titulo">
          <span class="grupo-badge">${items.length} personas</span>
          ${escHtml(grupo.nombre)}
        </span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span class="grupo-total">${fmt(total)}</span>
          <span class="grupo-arrow open" id="arrow-${gi}">▾</span>
        </span>
      </div>
      <div class="grupo-body open" id="body-${gi}">
        <table class="ing-table">
          <thead>
            <tr>
              <th>Compañero/a</th>
              <th class="right">Total aportado</th>
            </tr>
          </thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
    </div>`;
  }).join("");
}

function toggleGrupo(gi) {
  const body  = document.getElementById("body-" + gi);
  const arrow = document.getElementById("arrow-" + gi);
  body.classList.toggle("open");
  arrow.classList.toggle("open");
}

// ── Render gastos con pagos ───────────────────────────────────
function renderGastos(gastos, pagos) {
  if (!gastos || !gastos.length) return '<div class="status-msg">Sin gastos</div>';

  // Agrupar pagos por nombre de proveedor (aproximación)
  const pagosPorPartner = {};
  (pagos || []).forEach(p => {
    const k = p.nombre;
    if (!pagosPorPartner[k]) pagosPorPartner[k] = [];
    pagosPorPartner[k].push(p);
  });

  const filas = gastos.map(g => {
    let badge = "";
    if (g.pagado_bool) {
      badge = `<span class="badge badge-paid">Pagado</span>`;
    } else if (g.pagado_acum > 0) {
      badge = `<span class="badge badge-partial">Parcial</span>`;
    } else {
      badge = `<span class="badge badge-pending">Pendiente</span>`;
    }

    const saldoClass = g.saldo <= 0 ? "saldo-cero" : "saldo";
    const pagLink = `<a href="${escHtml(g.url)}" target="_blank" class="ext-link">${escHtml(g.comprobante)} ${iconoExt()}</a>`;

    // Pagos del mismo proveedor
    const pagosDelPartner = pagosPorPartner[g.nombre] || [];
    let pagosHtml = "";
    if (pagosDelPartner.length) {
      const filasPagos = pagosDelPartner.map(p => `
        <div class="pago-row">
          <span>
            <span class="pago-ref">${escHtml(p.referencia)}</span>
            <span class="pago-fecha">${fmtFecha(p.fecha)}</span>
          </span>
          <span style="display:flex;align-items:center;gap:6px;">
            <span class="pago-monto">${fmt(p.monto)}</span>
            <a href="${escHtml(p.url)}" target="_blank" class="pago-link">${iconoExt()} ver</a>
          </span>
        </div>`).join("");
      pagosHtml = `<div class="pagos-titulo">Pagos realizados</div>${filasPagos}`;
    }

    return `
    <div class="gas-item">
      <div class="gas-item-header">
        <div>
          <div class="gas-nombre">${escHtml(g.nombre)} ${badge}</div>
          <div class="gas-comprobante">${pagLink} · ${fmtFecha(g.fecha)}</div>
        </div>
      </div>
      <div class="gas-montos">
        <div class="gas-monto-item">
          <div class="gas-monto-label">Monto total</div>
          <div class="gas-monto-value total">${fmt(g.monto_total)}</div>
        </div>
        <div class="gas-monto-item">
          <div class="gas-monto-label">Pagado</div>
          <div class="gas-monto-value pagado">${fmt(g.pagado_acum)}</div>
        </div>
        <div class="gas-monto-item">
          <div class="gas-monto-label">Saldo</div>
          <div class="gas-monto-value ${saldoClass}">${fmt(g.saldo)}</div>
        </div>
      </div>
      ${pagosHtml}
    </div>`;
  }).join("");

  return `<div class="gas-table-wrap">${filas}</div>`;
}

// ── Actualizar UI ─────────────────────────────────────────────
function actualizarUI(data) {
  const { resumen, grupos_ingresos, gastos, pagos, actualizado } = data;

  document.getElementById("kpi-ing").textContent    = fmt(resumen.total_ingresos);
  document.getElementById("kpi-ing-sub").textContent = resumen.cant_ingresos + " registro" + (resumen.cant_ingresos !== 1 ? "s" : "");
  document.getElementById("kpi-gas").textContent    = fmt(resumen.total_gastos);
  document.getElementById("kpi-gas-sub").textContent = resumen.cant_gastos + " factura" + (resumen.cant_gastos !== 1 ? "s" : "");
  document.getElementById("kpi-pagado").textContent = fmt(resumen.total_pagado_gs);

  const salEl = document.getElementById("kpi-sal");
  salEl.textContent  = fmt(resumen.saldo_caja);
  salEl.className    = "kpi-value " + (resumen.saldo_caja >= 0 ? "pos" : "neg");

  const pct = Math.min(100, Math.round((resumen.total_ingresos / META) * 100));
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("pct-label").textContent    = pct + "%";
  document.getElementById("meta-label").textContent   = "Meta: " + fmt(META);
  const falta = META - resumen.total_ingresos;
  document.getElementById("falta-label").textContent  = falta > 0 ? "Faltan " + fmt(falta) : "¡Meta superada!";

  document.getElementById("grupos-ingresos").innerHTML = renderGruposIngresos(grupos_ingresos);
  document.getElementById("lista-gastos").innerHTML    = renderGastos(gastos, pagos);

  const d = new Date(actualizado);
  document.getElementById("timestamp").textContent =
    "Actualizado: " + d.toLocaleDateString("es-BO") + " " + d.toLocaleTimeString("es-BO");
}

// ── Fetch ─────────────────────────────────────────────────────
async function cargar() {
  const btn  = document.getElementById("btn-refresh");
  const icon = document.getElementById("refresh-icon");
  btn.disabled = true;
  icon.innerHTML = `<span class="spinner" style="width:12px;height:12px;border-width:1.5px;"></span>`;
  document.getElementById("error-box").style.display = "none";
  try {
    const resp = await fetch(APPS_SCRIPT_URL + "?t=" + Date.now());
    const json = await resp.json();
    if (!json.ok) throw new Error(json.error || "Error desconocido");
    actualizarUI(json.data);
  } catch(e) {
    document.getElementById("error-box").textContent = "Error al cargar datos: " + e.message;
    document.getElementById("error-box").style.display = "block";
  } finally {
    btn.disabled = false;
    icon.textContent = "↻";
  }
}

cargar();
setInterval(cargar, 5 * 60 * 1000);
</script>
</body>
</html>
